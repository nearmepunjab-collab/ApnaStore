<!DOCTYPE html>
<html lang="en" translate="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="google" content="notranslate" />
  <title>ApnaStore - Shop Smart, Save More</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
    body { background-color: #f1f3f6; color: #212121; }

    header {
      background: linear-gradient(135deg, #1A73E8 0%, #0D47A1 100%);
      position: sticky; top: 0; z-index: 1000;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
    }
    .header-container {
      max-width: 1240px; margin: 0 auto;
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 20px; gap: 20px;
    }
    .brand-logo {
      display: flex; align-items: center; gap: 10px;
      text-decoration: none; color: white; font-weight: 700; font-size: 22px;
      cursor: pointer;
    }
    .brand-logo img { height: 38px; border-radius: 6px; background: white; padding: 2px; }
    .brand-logo span { color: #FFE500; }

    .search-box { flex-grow: 1; max-width: 550px; position: relative; }
    .search-box input {
      width: 100%; padding: 11px 45px 11px 18px; border: none;
      border-radius: 25px; outline: none; font-size: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    .search-box i { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); color: #1A73E8; }

    .cart-btn {
      background: #FFE500; color: #0D47A1; border: none;
      padding: 10px 22px; border-radius: 25px; font-weight: 700;
      cursor: pointer; display: flex; align-items: center; gap: 10px; font-size: 15px;
    }
    .cart-badge { background: #ff3e6c; color: white; padding: 2px 8px; border-radius: 12px; font-size: 12px; }

    .main-content { max-width: 1240px; margin: 0 auto; padding: 20px 15px 40px; }
    
    /* Sections View Controller */
    .view-section { display: none; }
    .view-section.active { display: block; }

    .hero-banner {
      background: linear-gradient(135deg, #FF512F, #DD2476); color: white;
      border-radius: 16px; padding: 35px 30px; margin-bottom: 25px;
      display: flex; justify-content: space-between; align-items: center;
    }

    .section-card { background: white; border-radius: 16px; padding: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    .section-title { font-size: 22px; font-weight: 700; border-bottom: 2px solid #f0f0f0; padding-bottom: 15px; margin-bottom: 25px; }

    .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 22px; }
    .product-card {
      border: 1px solid #eaeaea; border-radius: 12px; padding: 15px;
      background: white; position: relative; display: flex; flex-direction: column;
    }
    .badge-discount { position: absolute; top: 12px; left: 12px; background: #388e3c; color: white; font-size: 11px; font-weight: 700; padding: 3px 7px; border-radius: 4px; }
    .product-img-box { height: 160px; display: flex; align-items: center; justify-content: center; margin-bottom: 12px; }
    .product-img-box img { max-height: 100%; max-width: 100%; object-fit: contain; }
    .product-title { font-size: 14px; font-weight: 600; margin-bottom: 6px; }
    .price-container { display: flex; align-items: baseline; gap: 8px; margin-bottom: 15px; }
    .curr-price { font-size: 17px; font-weight: 700; color: #111; }
    .old-price { font-size: 13px; color: #878787; text-decoration: line-through; }
    
    .btn-action {
      margin-top: auto; width: 100%; background: #ff9f00; color: white;
      border: none; padding: 10px; border-radius: 6px; font-weight: 700;
      cursor: pointer; text-align: center;
    }
    .btn-action:hover { background: #e68f00; }

    /* Cart Page Specific Styling */
    .cart-container { display: flex; flex-direction: column; gap: 15px; }
    .cart-item-row { display: flex; align-items: center; justify-content: space-between; background: white; padding: 15px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    .cart-item-info { display: flex; align-items: center; gap: 15px; }
    .cart-item-info img { width: 60px; height: 60px; object-fit: contain; }

    footer { background: #0f172a; color: #94a3b8; text-align: center; padding: 25px; font-size: 13px; margin-top: 40px; }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="notranslate">
    <div class="header-container">
      <a class="brand-logo" onclick="switchView('home')">
        <img src="./logo.png" alt="Logo" onerror="this.style.display='none'">
        Apna<span>Store</span>
      </a>

      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search products..." onkeyup="filterProducts()">
        <i class="fa-solid fa-magnifying-glass"></i>
      </div>

      <button class="cart-btn" onclick="switchView('cart')">
        <i class="fa-solid fa-cart-shopping"></i>
        Cart
        <span class="cart-badge" id="cartCount">0</span>
      </button>
    </div>
  </header>

  <main class="main-content notranslate">
    
    <!-- HOME PAGE VIEW -->
    <div id="homeView" class="view-section active">
      <div class="hero-banner">
        <div>
          <h2>Grand Festival Sale!</h2>
          <p>Explore top products with direct WhatsApp checkout.</p>
        </div>
        <i class="fa-solid fa-bag-shopping" style="font-size: 60px; opacity: 0.8;"></i>
      </div>

      <div class="section-card">
        <h2 class="section-title">Deals of the Day</h2>
        <div class="products-grid" id="productsGrid"></div>
      </div>
    </div>

    <!-- CART PAGE VIEW -->
    <div id="cartView" class="view-section">
      <div class="section-card">
        <h2 class="section-title"><i class="fa-solid fa-cart-shopping"></i> My Shopping Cart</h2>
        <div id="cartItemsList" class="cart-container">
          <!-- Cart items will load here -->
        </div>
        <div id="cartSummary" style="margin-top: 25px; text-align: right; display: none;">
          <h3 style="margin-bottom: 15px;">Total Amount: <span id="cartTotalPrice" style="color: #1A73E8;">₹0</span></h3>
          <button onclick="checkoutWhatsApp()" style="background: #25D366; color: white; border: none; padding: 12px 30px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer;">
            <i class="fa-brands fa-whatsapp"></i> Checkout via WhatsApp
          </button>
        </div>
      </div>
    </div>

  </main>

  <footer>
    <p>&copy; 2026 ApnaStore. All rights reserved.</p>
  </footer>

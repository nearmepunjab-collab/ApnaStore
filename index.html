<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ApnaStore - Online Shopping Hub</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans">

    <!-- Header / Navbar -->
    <header class="bg-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <!-- Logo Added Here -->
            <a href="#" class="flex items-center">
                <img src="logo.png" alt="ApnaStore Logo" class="h-12 w-auto object-contain">
            </a>
            
            <nav class="hidden md:flex space-x-6 text-gray-600 font-medium">
                <a href="#" class="hover:text-indigo-600">Home</a>
                <a href="#products" class="hover:text-indigo-600">Products</a>
                <a href="#about" class="hover:text-indigo-600">About Us</a>
                <a href="#contact" class="hover:text-indigo-600">Contact</a>
            </nav>
            <div>
                <a href="#products" class="bg-indigo-600 text-white px-4 py-2 rounded-lg font-medium hover:bg-indigo-700 transition">Shop Now</a>
            </div>
        </div>
    </header>

    <!-- Hero Section -->
    <section class="bg-gradient-to-r from-indigo-500 to-purple-600 text-white py-20 px-4 text-center">
        <div class="max-w-3xl mx-auto">
            <h2 class="text-4xl md:text-5xl font-extrabold mb-4">Welcome to ApnaStore</h2>
            <p class="text-lg md:text-xl mb-8 text-indigo-100">Find the best products at unbeatable prices, delivered right to your doorstep.</p>
            <a href="#products" class="bg-white text-indigo-600 font-bold px-8 py-3 rounded-full shadow-lg hover:bg-gray-100 transition">Explore Products</a>
        </div>
    </section>

    <!-- Products Section -->
    <section id="products" class="max-w-7xl mx-auto px-4 py-16">
        <h3 class="text-3xl font-bold text-center text-gray-800 mb-10">Featured Products</h3>
        
        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-8">
            
            <!-- Product 1 -->
            <div class="bg-white rounded-xl shadow-md overflow-hidden hover:shadow-xl transition">
                <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500&auto=format&fit=crop&q=60" alt="Headphones" class="w-full h-48 object-cover">
